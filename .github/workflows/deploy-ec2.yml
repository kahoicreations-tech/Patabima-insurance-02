name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to EC2 via SSM
        run: |
          echo "🚀 Deploying to EC2..."

          # Send deployment command via AWS SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /var/www/patabima",
              "sudo -u ec2-user git pull origin main",
              "source venv/bin/activate",
              "pip install -r insurance-app/requirements.txt",
              "cd insurance-app",
              "python manage.py migrate --noinput",
              "python manage.py collectstatic --noinput",
              "sudo systemctl restart patabima",
              "sudo systemctl restart nginx"
            ]' \
            --output text \
            --query "Command.CommandId")

          echo "Command ID: $COMMAND_ID"

          # Wait for command to complete
          echo "⏳ Waiting for deployment to complete..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          # Get command status
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          if [ "$STATUS" = "Success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed with status: $STATUS"
            exit 1
          fi

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."

          # Get EC2 public IP
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "🌐 Application URL: http://$PUBLIC_IP"

          # Test health endpoint (add this to your Django app)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$PUBLIC_IP/api/health/" || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health check passed!"
          else
            echo "⚠️  Health check returned HTTP $HTTP_CODE"
          fi
