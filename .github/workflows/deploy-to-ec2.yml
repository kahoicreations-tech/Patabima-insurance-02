name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'insurance-app/**'
      - '.github/workflows/deploy-to-ec2.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy Django Backend to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Deploy to EC2 via SSM
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          
          # Create deployment script
          cat > deploy_script.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "🚀 Starting deployment..."
          
          # Navigate to app directory
          cd /var/www/patabima
          
          # Backup current code
          timestamp=$(date +%Y%m%d_%H%M%S)
          sudo cp -r /var/www/patabima /var/www/patabima_backup_$timestamp
          
          # Pull latest code
          echo "📥 Pulling latest code from GitHub..."
          git fetch origin main
          git reset --hard origin/main
          
          # Activate virtual environment
          source venv/bin/activate
          
          # Install/update dependencies
          echo "📦 Installing dependencies..."
          pip install -r requirements.txt --upgrade
          
          # Run migrations
          echo "🗄️ Running database migrations..."
          python manage.py migrate --noinput
          
          # Collect static files
          echo "📁 Collecting static files..."
          python manage.py collectstatic --noinput
          
          # Restart services
          echo "🔄 Restarting services..."
          sudo systemctl restart patabima
          sudo systemctl restart nginx
          
          # Health check
          sleep 5
          if sudo systemctl is-active --quiet patabima; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed - reverting..."
            sudo rm -rf /var/www/patabima
            sudo mv /var/www/patabima_backup_$timestamp /var/www/patabima
            sudo systemctl restart patabima
            exit 1
          fi
          
          # Cleanup old backups (keep last 3)
          cd /var/www
          ls -t patabima_backup_* | tail -n +4 | xargs -r sudo rm -rf
          
          echo "🎉 Deployment complete!"
          EOF
          
          # Upload script to S3
          aws s3 cp deploy_script.sh s3://patabima-media-prod/deployment/deploy_script.sh
          
          # Execute on EC2 via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 cp s3://patabima-media-prod/deployment/deploy_script.sh /tmp/deploy.sh",
              "chmod +x /tmp/deploy.sh",
              "bash /tmp/deploy.sh"
            ]' \
            --output text \
            --query 'Command.CommandId')
          
          echo "Command ID: $COMMAND_ID"
          
          # Wait for command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          
          # Get command output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
      
      - name: Verify Deployment
        run: |
          # Get EC2 public IP
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          
          echo "Testing API at http://$PUBLIC_IP/api/"
          
          # Wait for services to stabilize
          sleep 10
          
          # Test API endpoint
          response=$(curl -s -o /dev/null -w "%{http_code}" http://$PUBLIC_IP/api/ || echo "000")
          
          if [ "$response" = "200" ] || [ "$response" = "301" ]; then
            echo "✅ API is responding (HTTP $response)"
          else
            echo "❌ API health check failed (HTTP $response)"
            exit 1
          fi
      
      - name: Notify on Success
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo "API URL: http://$(aws ec2 describe-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }} --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)/api/"
      
      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check logs above."
